name: Deploy Frontend to Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy to MilesWeb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: https://api.travelzynclabs.in

      - name: Setup SSH Key
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' '${{ secrets.SSH_PRIVATE_KEY }}' > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

      - name: Deploy dist contents to server via rsync
        run: |
          rsync -avz \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 22999" \
            --exclude='.well-known' \
            --exclude='cgi-bin' \
            --exclude='.htaccess' \
            dist/ \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/wgwhakud/travelzynclabs.in/"
